name: Bug report
description: Something in the daemon, CLI, TUI, or packaging is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The observed behaviour and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, config shape, and platform. Redact keys and PSKs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vallum --version`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [handshake, data plane, UAPI, TUI, packaging, docs]
    validations:
      required: true
