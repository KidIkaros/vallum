# Vallum's CI: the gates that were run by hand through P6.8, now repeatable.
#
# One checkout: the crypto SDK is a git dependency (`origin-crypto-sdk = { git,
# tag }`), so cargo fetches it itself.
#
# The runner is chosen by repository visibility, and that choice is the fork
# guard:
#
#   private  → `self-hosted, linux, x64` (this account's machine, `wingman-vps`)
#   public   → `ubuntu-latest`, always
#
# Self-hosting exists because hosted Actions minutes are refused on this
# account — "the job was not started because recent account payments have failed
# or your spending limit needs to be increased" — before a runner is even
# assigned, so `ubuntu-latest` alone would queue every push until the repository
# is public (public minutes are free). Self-hosting is safe only while the
# repository is private, because a private repository has no forks: there is no
# untrusted `pull_request` to execute on a persistent machine. The moment it is
# public, every job moves to a disposable runner with no secrets, which is what
# makes outside PRs safe to run at all. Do not hard-code `self-hosted` anywhere:
# a public repository with a self-hosted label in a `pull_request` workflow
# executes a stranger's code on that machine.
#
# The e2e job needs unprivileged user namespaces. The self-hosted host allows
# them; where an image does not — Ubuntu 24.04's AppArmor default — the step
# falls back to `sudo -E` (passwordless on both runner types), and the script
# creates its own namespaces either way.

name: ci

# `push` is `main` only, deliberately. Dependabot pushes its own branches too,
# and on a single self-hosted runner each dependency update queued a full matrix
# that sat in front of `main` for hours — `test (stable)` on 89d7213 never
# started. Nothing is lost by narrowing it: dependency branches are covered by
# `pull_request`, and tags by `release.yml` plus the `main` push that carries the
# tagged commit (a tag's commit has already been tested as a branch head).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    # Public ⇒ hosted, always. See the header for why this is the fork guard.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Stable is the working toolchain; 1.95.0 is the declared MSRV.
        toolchain: [stable, "1.95.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum

      - name: GUI build dependencies (WebKitGTK)
        working-directory: vallum
        # `vallum-gui` links the system WebView, so the workspace build needs the
        # development files. Checked rather than installed unconditionally: a
        # runner that already has them pays nothing, and a runner that does not
        # fails here with the package names instead of at a link step later.
        run: |
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 libsoup-3.0; then
            echo "WebKitGTK development files already present"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev libxdo-dev librsvg2-dev \
              libayatana-appindicator3-dev patchelf
          fi

      - name: Format (scoped to the Vallum crates)
        working-directory: vallum
        # Never `--all`: the SDK is an external dependency and is not ours to format.
        run: >
          cargo fmt
          -p vallum-core -p vallum-tunnel -p vallum
          -p vallum-crypto -p vallum-crypto-sdk -p vallum-crypto-contract
          -p vallum-config -p vallum-quick -p vallum-gui
          -- --check

      - name: Clippy (all features)
        working-directory: vallum
        # Stable only. The lint set moves with the compiler, and 1.95's clippy
        # asks for `collapsible_match` rewrites that are not equivalent here:
        # `KeyCode::Left => { if !masked { .. } }` becomes a *guarded arm*, which
        # falls through to later arms instead of doing nothing. The MSRV leg
        # exists to prove the code builds and tests on 1.95; suggestions are
        # judged on the compiler whose lints are current.
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: vallum
        run: cargo test --workspace

      - name: Test the lean daemon (no TUI)
        working-directory: vallum
        run: cargo test -p vallum --no-default-features

      - name: Headless TUI snapshot
        working-directory: vallum
        run: |
          cargo run -p vallum -- tui --snapshot --width 120 --height 30 > /tmp/tui.txt
          grep -q Vallum /tmp/tui.txt

      - name: Package manifest parity (install.sh == deb == rpm)
        working-directory: vallum
        run: scripts/check-package-manifest.sh

  e2e:
    name: end-to-end (two namespaces, real kernel)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum

      - name: Build both binaries
        working-directory: vallum
        # `vallum-quick` is not optional here: the full-tunnel phase installs
        # the product's own route plan with it, and the script refuses to start
        # without it — a daemon-only build fails at the gate's first line.
        run: cargo build -p vallum -p vallum-quick

      - name: Run the netns gate
        working-directory: vallum
        # Both binaries default to `target/debug/`; the script copies them into
        # /tmp itself, because the user namespace it creates cannot traverse the
        # home directory the runner checks out into.
        #
        # The script creates its own user and network namespaces. Some runners
        # restrict unprivileged user namespaces (Ubuntu 24.04's AppArmor
        # default); there, the same script runs under sudo. A failure is never
        # skipped — it either passes one way or fails the job.
        run: bash scripts/e2e-netns.sh || sudo -E bash scripts/e2e-netns.sh

  audit:
    name: advisories and supply chain
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    # A fork PR's token is read-only, so `audit-check`'s check run would fail
    # there for a reason that says nothing about the change.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      # A toolchain step is not optional here: `audit-check` fails at "unable to
      # locate executable file: cargo" if the image ships none, and naming the
      # toolchain keeps this job independent of the image's Rust version.
      - uses: dtolnay/rust-toolchain@stable

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: vallum

      - uses: taiki-e/install-action@cargo-deny
      - name: deny.toml (licenses, sources, bans, advisories)
        working-directory: vallum
        run: cargo deny check
