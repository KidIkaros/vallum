# Vallum's CI: the gates that were run by hand through P6.8, now repeatable.
#
# One checkout: the crypto SDK is a git dependency (`origin-crypto-sdk = { git,
# tag }`), so cargo fetches it itself.
#
# The runner is chosen by repository visibility, and that choice is the fork
# guard:
#
#   private  → `self-hosted, linux, x64` (this account's machine, `wingman-vps`)
#   public   → `ubuntu-latest`, always
#
# Self-hosting exists because hosted Actions minutes are refused on this
# account — "the job was not started because recent account payments have failed
# or your spending limit needs to be increased" — before a runner is even
# assigned, so `ubuntu-latest` alone would queue every push until the repository
# is public (public minutes are free). Self-hosting is safe only while the
# repository is private, because a private repository has no forks: there is no
# untrusted `pull_request` to execute on a persistent machine. The moment it is
# public, every job moves to a disposable runner with no secrets, which is what
# makes outside PRs safe to run at all. Do not hard-code `self-hosted` anywhere:
# a public repository with a self-hosted label in a `pull_request` workflow
# executes a stranger's code on that machine.
#
# The e2e job needs unprivileged user namespaces. The self-hosted host allows
# them; where an image does not — Ubuntu 24.04's AppArmor default — the step
# falls back to `sudo -E` (passwordless on both runner types), and the script
# creates its own namespaces either way.

name: ci

# `push` is `main` only, deliberately. Dependabot pushes its own branches too,
# and on a single self-hosted runner each dependency update queued a full matrix
# that sat in front of `main` for hours — `test (stable)` on 89d7213 never
# started. Nothing is lost by narrowing it: dependency branches are covered by
# `pull_request`, and tags by `release.yml` plus the `main` push that carries the
# tagged commit (a tag's commit has already been tested as a branch head).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # On a branch, a newer push makes the older run irrelevant - cancel it. On
  # main it does NOT: a run that completes is the evidence that a commit is
  # good, and cancelling it means the evidence for a commit never exists. The
  # queue is slower than the work; losing the record is worse than waiting.
  #
  # Main runs get a group of their own, keyed by run id, so that no other run
  # can ever land in it and cancel them. An earlier version expressed this as
  # `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}`, and runs on
  # main were still being cancelled - the expression was not evaluated the way
  # it reads. A group nothing else can join does not depend on that.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    # Public ⇒ hosted, always. See the header for why this is the fork guard.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Stable is the working toolchain; 1.95.0 is the declared MSRV.
        toolchain: [stable, "1.95.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum

      - name: GUI build dependencies (WebKitGTK)
        working-directory: vallum
        # `vallum-gui` links the system WebView, so the workspace build needs the
        # development files. Checked rather than installed unconditionally: a
        # runner that already has them pays nothing, and a runner that does not
        # fails here with the package names instead of at a link step later.
        #
        # The flags are about the *shared* runner rather than about the packages:
        # `DEBIAN_FRONTEND` keeps a debconf prompt from blocking a job that has
        # nobody to answer it, and `DPkg::Lock::Timeout` turns an unattended
        # upgrade holding the lock into a wait instead of an immediate failure.
        # `timeout-minutes` bounds that wait, since apt will retry a lock for as
        # long as it is told to and a stuck lock is not worth a hung job.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 libsoup-3.0; then
            echo "WebKitGTK development files already present"
          else
            sudo apt-get -o DPkg::Lock::Timeout=60 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=60 install -y \
              --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev libxdo-dev librsvg2-dev \
              libayatana-appindicator3-dev patchelf
          fi

      - name: Node (the console's frontend is a build artifact)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Console frontend
        working-directory: vallum/crates/vallum-gui/ui
        # `tauri::generate_context!()` embeds `ui/dist` at compile time and
        # panics when it is absent — and `dist/` is gitignored, because it is a
        # build artifact. Without this step the whole workspace fails to compile
        # in CI, which is what the first run of this workflow found on
        # 2026-11-12: not a lint failure, a missing frontend.
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Format (scoped to the Vallum crates)
        working-directory: vallum
        # Never `--all`: the SDK is an external dependency and is not ours to format.
        run: >
          cargo fmt
          -p vallum-core -p vallum-tunnel -p vallum
          -p vallum-crypto -p vallum-crypto-sdk -p vallum-crypto-contract
          -p vallum-config -p vallum-quick -p vallum-gui
          -- --check

      - name: Clippy (all features)
        working-directory: vallum
        # Stable only. The lint set moves with the compiler, and 1.95's clippy
        # asks for `collapsible_match` rewrites that are not equivalent here:
        # `KeyCode::Left => { if !masked { .. } }` becomes a *guarded arm*, which
        # falls through to later arms instead of doing nothing. The MSRV leg
        # exists to prove the code builds and tests on 1.95; suggestions are
        # judged on the compiler whose lints are current.
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: vallum
        if: matrix.toolchain == 'stable'
        # The full suite runs on stable only. The MSRV leg is about whether the
        # code *compiles* on 1.95 — a new edition feature, a std API that did not
        # exist yet — and that is a question `cargo check --all-targets` answers.
        # Running the whole suite twice was half the job's cost (1023 s + 299 s on
        # 1.95 against 946 s + 292 s on stable) for a class of failure the runtime
        # cannot see; behavior is judged on the compiler whose lints are current.
        # The trade is real: a 1.95-only *runtime* difference would now reach
        # `main`. None is known, and the compile check still walks every target.
        #
        # The lossy-path measurement in `vallum-protocol-tests` skips itself where
        # `unshare`, `tc` or `nsenter` is missing. On the private self-hosted host
        # that skip would delete the transport's only measured cost with the job
        # still green, so there it is an error. A public fork runs on a shared
        # runner Vallum does not control, where unprivileged user namespaces can
        # be restricted, and the skip stays a skip.
        env:
          VALLUM_LOSSY_REQUIRED: ${{ github.event.repository.private && '1' || '0' }}
          # Where the measurement leaves its tables. Cargo captures a passing
          # test's output, so without this the numbers exist only on the machine
          # that ran them.
          VALLUM_LOSSY_TABLE: ${{ runner.temp }}/carrier-table.txt
        run: cargo test --workspace

      - name: Compile every target (MSRV)
        working-directory: vallum
        if: matrix.toolchain != 'stable'
        # `--all-targets` includes the test, bench and example targets, so the
        # suite above still has to compile on 1.95 even though it does not run
        # there. Default features only: they are the surface the previous 1.95 leg
        # proved, and the feature-gated code is compiled by the stable clippy step
        # (`--all-features`) — widening this one would put a new failure mode in a
        # job whose purpose is the compiler version, not the feature set.
        run: cargo check --workspace --all-targets

      - name: Compile the lean daemon (MSRV)
        working-directory: vallum
        if: matrix.toolchain != 'stable'
        run: cargo check -p vallum --no-default-features --all-targets

      - name: Record the carrier's measured tables
        if: always() && matrix.toolchain == 'stable'
        # A green check says the measurement ran; the summary says what it found,
        # so a change in the transport's cost is visible in the run that changed
        # it rather than in a doc nobody re-measures.
        # Printed as well as summarised: the summary is what the check page shows,
        # the log is what is left after the run's artefacts expire.
        run: |
          table="${{ runner.temp }}/carrier-table.txt"
          if [ -s "$table" ]; then
            {
              echo '### TCP carrier and datagrams, measured on this runner'
              echo '```'
              cat "$table"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'the carrier measurement wrote no table, so it did not run' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test the lean daemon (no TUI)
        working-directory: vallum
        if: matrix.toolchain == 'stable'
        run: cargo test -p vallum --no-default-features

      - name: Headless TUI snapshot
        working-directory: vallum
        if: matrix.toolchain == 'stable'
        run: |
          cargo run -p vallum -- tui --snapshot --width 120 --height 30 > /tmp/tui.txt
          grep -q Vallum /tmp/tui.txt

      - name: The enrolment desk (python service)
        working-directory: vallum
        run: python3 -m unittest discover -s service -p 'test_*.py'

      - name: Package manifest parity (install.sh == deb == rpm)
        working-directory: vallum
        run: scripts/check-package-manifest.sh

      - name: Durable state coverage (every store named in the backup doc)
        working-directory: vallum
        run: scripts/check-state-coverage.sh

      - name: Desk database copies and restores (the irreplaceable state)
        working-directory: vallum
        run: scripts/accept-desk-restore.sh

      - name: A deployment copies and restores before --clean-remote deletes it
        working-directory: vallum
        run: scripts/accept-deployment-backup.sh

  e2e:
    name: end-to-end (two namespaces, real kernel)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum

      - name: Build both binaries
        working-directory: vallum
        # `vallum-quick` is not optional here: the full-tunnel phase installs
        # the product's own route plan with it, and the script refuses to start
        # without it — a daemon-only build fails at the gate's first line.
        run: cargo build -p vallum -p vallum-quick

      - name: Run the netns gate
        working-directory: vallum
        # Both binaries default to `target/debug/`; the script copies them into
        # /tmp itself, because the user namespace it creates cannot traverse the
        # home directory the runner checks out into.
        #
        # The script creates its own user and network namespaces. Some runners
        # restrict unprivileged user namespaces (Ubuntu 24.04's AppArmor
        # default); there, the same script runs under sudo. A failure is never
        # skipped — it either passes one way or fails the job.
        run: bash scripts/e2e-netns.sh || sudo -E bash scripts/e2e-netns.sh

      - name: Run the syscall allow-list gate
        working-directory: vallum
        # ADR-0028 step 4: the daemon must not make a syscall its own filter
        # does not name, or `enforce` mode kills it on that path in production.
        # The traced syscall set comes from the binary's own list, so the two
        # cannot disagree. `strace` is a dependency the script refuses to skip.
        run: |
          command -v strace > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)
          bash scripts/seccomp-trace.sh || sudo -E bash scripts/seccomp-trace.sh

      - name: Run the enforce-mode leg
        working-directory: vallum
        # `docs/proof/seccomp.md` §5.2: enforce mode had never run against a live
        # daemon, because the drop calls `setgroups` and an unprivileged user
        # namespace denies it. This asserts the kernel really has the filter on
        # the dropped daemon, that every thread it starts inherits it, and that
        # the tunnel still carries traffic — as root, where the drop works.
        run: bash scripts/seccomp-enforce.sh || sudo -E bash scripts/seccomp-enforce.sh

  install:
    name: install (staged; no root, no container runtime)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    # The installer is run into a staging directory: it lays the real files
    # down and touches nothing else. This is the install tier that needs no
    # docker, no root and no network, so it runs wherever CI runs - and it
    # checks what the installer PRODUCES, which the manifest-parity check
    # cannot: that check compares three manifests written by the same hand and
    # so cannot see a file all three of them promise and none of them ships.
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: taiki-e/install-action@cargo-deb

      - name: The install layout
        working-directory: vallum
        run: scripts/accept-install-layout.sh

      - name: What the packages actually contain
        working-directory: vallum
        # The manifest-parity check compares the three channels to EACH OTHER,
        # which cannot see two channels agreeing on being wrong - and they did:
        # every channel shipped the units and none of them shipped the
        # executables those units run, so every packaged tunnel start failed.
        # This builds the deb for real and asks the units themselves what they
        # need.
        run: scripts/accept-package-contents.sh

      - name: Publish the gate verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-install
          path: vallum/.vallum-verdicts/
          if-no-files-found: ignore

  acceptance:
    name: acceptance (a server and a client, provisioned here)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    # The pair provisions its own target: two namespaces joined by a veth, two
    # daemons, a real handshake and a ping that can only arrive through the
    # tunnel. No host, no SSH alias, no IP, no credential - so this gate can
    # run on any machine, which is the point of it (ADR-0032's shape, applied
    # to the harness).
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - uses: dtolnay/rust-toolchain@1.100.0

      - name: The acceptance pair
        working-directory: vallum
        # The script picks its backend: namespaces by default, docker only when
        # asked for and installed. On a runner whose AppArmor forbids
        # unprivileged user namespaces it escalates with sudo -E itself.
        run: scripts/accept-pair.sh

      - name: Publish the gate verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts
          path: vallum/.vallum-verdicts/
          if-no-files-found: ignore

  audit:
    name: advisories and supply chain
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    # A fork PR's token is read-only, so `audit-check`'s check run would fail
    # there for a reason that says nothing about the change.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      # A toolchain step is not optional here: `audit-check` fails at "unable to
      # locate executable file: cargo" if the image ships none, and naming the
      # toolchain keeps this job independent of the image's Rust version.
      - uses: dtolnay/rust-toolchain@1.100.0

      # `cargo audit`, not `rustsec/audit-check`. The action reports the audit on
      # stdout and then writes a GitHub check run; on this repository that write
      # fails with `404 Not Found - checks/runs#update-a-check-run` even with
      # `checks: write` granted, which reddens the job while the audit itself
      # says `"vulnerabilities":{"found":false,"count":0}`. The check run is
      # bookkeeping; the audit is the signal, and this has no API dependency.
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit (RustSec advisories)
        working-directory: vallum
        # Warnings (unmaintained, unsound) are informational and do not fail;
        # a real advisory does, which is the behaviour the action had.
        run: cargo audit

      - uses: taiki-e/install-action@cargo-deny
      - name: deny.toml (licenses, sources, bans, advisories)
        working-directory: vallum
        run: cargo deny check
      - name: the SDK is pinned once (one SDK in the binary)
        working-directory: vallum
        # `cargo deny` can only WARN about multiple versions, because the
        # workspace legitimately carries duplicates. The SDK is the one
        # dependency where a second copy would matter: the registry carries
        # only 0.7.2, the adapter cannot compile against it, and two copies
        # would mean two SDKs in one binary.
        run: bash scripts/check-sdk-pin.sh
