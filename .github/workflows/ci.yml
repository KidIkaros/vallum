# Vallum's CI: the gates that were run by hand through P6.8, now repeatable.
#
# One checkout: the crypto SDK is a git dependency (`origin-crypto-sdk = { git,
# tag }`), so cargo fetches it itself.
#
# The e2e job needs unprivileged user namespaces. GitHub's Ubuntu runners
# normally allow them; where they do not, the step falls back to `sudo`, which
# the script supports because it creates its own namespaces either way.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stable is the working toolchain; 1.95.0 is the declared MSRV.
        toolchain: [stable, "1.95.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: vallum

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum

      - name: Format (scoped to the Vallum crates)
        working-directory: vallum
        # Never `--all`: the SDK is an external dependency and is not ours to format.
        run: >
          cargo fmt
          -p vallum-core -p vallum-tunnel -p vallum
          -p vallum-crypto -p vallum-crypto-sdk -p vallum-crypto-contract
          -p vallum-config -p vallum-quick
          -- --check

      - name: Clippy (all features)
        working-directory: vallum
        # Stable only. The lint set moves with the compiler, and 1.95's clippy
        # asks for `collapsible_match` rewrites that are not equivalent here:
        # `KeyCode::Left => { if !masked { .. } }` becomes a *guarded arm*, which
        # falls through to later arms instead of doing nothing. The MSRV leg
        # exists to prove the code builds and tests on 1.95; suggestions are
        # judged on the compiler whose lints are current.
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: vallum
        run: cargo test --workspace

      - name: Test the lean daemon (no TUI)
        working-directory: vallum
        run: cargo test -p vallum --no-default-features

      - name: Headless TUI snapshot
        working-directory: vallum
        run: |
          cargo run -p vallum -- tui --snapshot --width 120 --height 30 > /tmp/tui.txt
          grep -q Vallum /tmp/tui.txt

      - name: Package manifest parity (install.sh == deb == rpm)
        working-directory: vallum
        run: scripts/check-package-manifest.sh

  e2e:
    name: end-to-end (two namespaces, real kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vallum

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum

      - name: Build both binaries
        working-directory: vallum
        # `vallum-quick` is not optional here: the full-tunnel phase installs
        # the product's own route plan with it, and the script refuses to start
        # without it — a daemon-only build fails at the gate's first line.
        run: cargo build -p vallum -p vallum-quick

      - name: Run the netns gate
        working-directory: vallum
        # Both binaries default to `target/debug/`; the script copies them into
        # /tmp itself, because the user namespace it creates cannot traverse the
        # home directory the runner checks out into.
        #
        # The script creates its own user and network namespaces. Some runners
        # restrict unprivileged user namespaces (Ubuntu 24.04's AppArmor
        # default); there, the same script runs under sudo. A failure is never
        # skipped — it either passes one way or fails the job.
        run: bash scripts/e2e-netns.sh || sudo -E bash scripts/e2e-netns.sh

  audit:
    name: advisories and supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: vallum

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: vallum

      - uses: taiki-e/install-action@cargo-deny
      - name: deny.toml (licenses, sources, bans, advisories)
        working-directory: vallum
        run: cargo deny check
