name: release

# A tag is a claim that a tree is deployable, so pushing one runs the cheap half
# of that claim: the tag names the version in `Cargo.toml`, the changelog has a
# section for it, and `scripts/release.sh`'s own preflight agrees the tag is at
# HEAD. A tag on a tree that would refuse to release fails here, before anything
# is built or uploaded.
#
# What a tag does *not* do is publish. Publishing needs two things that are
# deliberately outside this repository and its secrets: the release signing key
# (`~/.config/vallum/release-signing-key`, whose public half is committed at
# `packaging/vallum-release.pub`) and the two-host stamp written by
# `scripts/verify-remote.sh`. `scripts/release.sh` is the publisher, run on the
# machine that holds the key. Handing CI the key would make the trust anchor
# depend on a repository secret, and publishing unsigned assets from here would
# be worse than not publishing: `install.sh` warns on an unsigned release rather
# than refusing, so the first tag built by a runner would install with only a
# warning and look official.
#
# The full gate is `ci` on the same commit; `scripts/verify.sh` re-runs it with
# E2E at publish time.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  releasable:
    name: the tagged tree is releasable
    # Same visibility rule as every job (see ci.yml), though a tag push is
    # trusted input either way. The signing key this job deliberately does not
    # have is what publishing needs.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: vallum

      - name: The tag names the version in Cargo.toml
        working-directory: vallum
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "cannot read the workspace version"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
              echo "manual run on ${GITHUB_REF_NAME:-?}: a release tag would have to be v$version"
              exit 0
          fi
          test "$GITHUB_REF_NAME" = "v$version" || {
              echo "tag $GITHUB_REF_NAME does not match Cargo version $version"
              exit 1
          }

      - name: Release preflight
        working-directory: vallum
        # The script's own preflight, without its build: clean tree, tagged
        # commit is HEAD, `CHANGELOG.md` documents the version. The signing key
        # and the two-host stamp are checked at publish, on the machine that has
        # them; here the stamp is skipped with a reason rather than faked.
        run: >-
          scripts/release.sh --dry-run
          --skip-remote "CI has no second host; the stamp is written by the machine that publishes"
