name: release

# Hosted Actions is unavailable on the private/free plan. Releases are built and
# uploaded locally; re-enable the tag trigger when Actions is available.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vallum
      - uses: actions/checkout@v4
        with:
          repository: KidIkaros/OriginSDK
          path: origin-crypto-sdk
          token: ${{ secrets.SDK_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum

      - name: Check the tag matches the workspace version
        working-directory: vallum
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="vallum") | .version')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          }

      - name: Build the release binaries
        working-directory: vallum
        run: cargo build --release -p vallum -p vallum-quick

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build the packages
        working-directory: vallum
        run: |
          rm -rf target/debian crates/vallum/target/generate-rpm
          cargo deb -p vallum --no-build
          (cd crates/vallum && cargo generate-rpm)

      - name: Assemble the tarball
        working-directory: vallum
        run: |
          set -euo pipefail
          name="vallum-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/vallum target/release/vallum-quick "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          cp packaging/vallum.8 packaging/vallum-quick.8 packaging/vallum.toml.5 "dist/$name/"
          cp packaging/vallum.bash "dist/$name/"
          cp packaging/vallum@.service packaging/vallum-quick@.service "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp target/debian/*.deb dist/ 2>/dev/null || true
          version="${GITHUB_REF_NAME#v}"
          cp "crates/vallum/target/generate-rpm/vallum-${version}-"*.rpm dist/ 2>/dev/null || true
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS)

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: vallum/dist/*
          generate_release_notes: true
