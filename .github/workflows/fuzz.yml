# Fuzzing: a smoke run on every change, a long run every night.
#
# The targets and their invariants are described in docs/proof/fuzzing.md.
# `scripts/fuzz.sh` is the same gate locally; this workflow adds the corpus cache
# and the artifact upload, which are the two things a crash needs to be
# reproducible.
#
# One checkout: the crypto SDK is a git dependency and cargo fetches it.
#
# The runner follows repository visibility: self-hosted while private (no forks
# exist, so no untrusted code), GitHub-hosted the moment it is public (see
# ci.yml's header for why that is the fork guard).

name: fuzz

# `push` is `main` only for the same reason as ci.yml: a fuzz run is six
# targets, and dependabot's branches would queue them on the one self-hosted
# runner ahead of `main`. `pull_request` still covers dependency branches, the
# schedule still covers the long run, and a tag's commit is covered by the
# `main` push that carried it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A long run every week: 900s per target instead of the 60s smoke.
    - cron: '17 4 * * 0'
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }} (${{ github.event_name == 'schedule' && '900s' || '60s' }})
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [message_parse, handshake_decode, replay, shaping, enroll_parse, epoch_open]
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - uses: dtolnay/rust-toolchain@nightly

      # The fuzz build is a sanitizer, release, single-codegen-unit build of
      # every crate, and `checkout` cleans the tree between jobs — so without
      # this each of the six targets recompiles the world from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vallum
            vallum/fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: vallum/fuzz/corpus/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-

      - name: Run
        working-directory: vallum
        shell: bash
        run: |
          set -euo pipefail
          seconds=60
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=900; fi
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cp -n "fuzz/seeds/${{ matrix.target }}"/* "fuzz/corpus/${{ matrix.target }}"/ 2>/dev/null || true
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$seconds" -rss_limit_mb=2048 -timeout=10

      - name: Upload any crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            vallum/fuzz/artifacts/${{ matrix.target }}
            vallum/fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
