# Fuzzing: a smoke run on every change, a long run every night.
#
# The targets and their invariants are described in docs/proof/fuzzing.md.
# `scripts/fuzz.sh` is the same gate locally; this workflow adds the corpus cache
# and the artifact upload, which are the two things a crash needs to be
# reproducible.
#
# One checkout: the crypto SDK is a git dependency and cargo fetches it.
#
# The runner follows repository visibility: self-hosted while private (no forks
# exist, so no untrusted code), GitHub-hosted the moment it is public (see
# ci.yml's header for why that is the fork guard).

name: fuzz

# `push` is `main` only for the same reason as ci.yml: dependabot's branches
# would queue fuzz runs on the one self-hosted runner ahead of `main`.
# `pull_request` still covers dependency branches, the schedule still covers the
# long run, and a tag's commit is covered by the `main` push that carried it.
#
# All six targets run in one job, sequentially, rather than as a six-way matrix.
# Measured on the runner, each matrix job cost 2.9 min: 143 s in the run step (a
# fuzz build of roughly 80 s plus 60 s of fuzzing) and the rest in setup,
# checkout, toolchain and cache restore. The build is identical for all six
# targets, so the matrix paid it six times and put six separate queue slots in
# front of every other workflow. One job builds once and then fuzzes for 6 min:
# the same coverage in roughly half the runner time, and one slot. A failed
# target does not stop the ones after it; the job fails at the end with the list.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A long run every week: 900s per target instead of the 60s smoke.
    - cron: '17 4 * * 0'
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (six targets, ${{ github.event_name == 'schedule' && '900s' || '60s' }} each)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: vallum

      - uses: dtolnay/rust-toolchain@nightly

      # The fuzz build is a sanitizer, release, single-codegen-unit build of
      # every crate. It is paid once per run now, and this is what keeps it from
      # being paid once per push.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vallum
            vallum/fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: vallum/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Run
        working-directory: vallum
        shell: bash
        # `set -u` but not `-e`: a crashing target must not hide the five that
        # follow it, and the failure is re-raised once all six have run.
        run: |
          set -uo pipefail
          seconds=60
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=900; fi
          failed=()
          for target in message_parse handshake_decode replay shaping enroll_parse epoch_open segment_reassembly carrier_framing; do
            mkdir -p "fuzz/corpus/$target"
            cp -n "fuzz/seeds/$target"/* "fuzz/corpus/$target"/ 2>/dev/null || true
            echo "=== $target (${seconds}s)"
            if ! cargo +nightly fuzz run "$target" -- \
                -max_total_time="$seconds" -rss_limit_mb=2048 -timeout=10; then
              failed+=("$target")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "fuzz: targets that failed: ${failed[*]}" >&2
            exit 1
          fi

      - name: Upload any crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: |
            vallum/fuzz/artifacts
            vallum/fuzz/corpus
          if-no-files-found: ignore
          retention-days: 30
