name: macos-experimental

# The daemon's SDK dependency builds C (blake3/zstd) with Apple clang. This job
# surfaces the remaining cfg gaps but does not gate a release yet; the protocol
# crates are gated by the `macOS check (protocol crates)` job in ci.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  daemon:
    name: macOS check (daemon, experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: vallum
      - uses: actions/checkout@v4
        with:
          repository: KidIkaros/OriginSDK
          path: origin-crypto-sdk
          token: ${{ secrets.SDK_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vallum
      - name: Check the daemon for macOS
        working-directory: vallum
        run: cargo check -p vallum
