name: runner-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "user: $(id -un)"
          sudo -n unshare -Urn true 2>&1; echo "sudo unshare rc: $?"
          sudo -n ip netns add probe-ns 2>&1; echo "ip netns rc: $?"
          sudo -n ip netns del probe-ns 2>/dev/null
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1
          docker version --format 'server {{.Server.Version}}' 2>&1; echo "docker rc: $?"
          sudo -n docker version --format 'sudo docker server {{.Server.Version}}' 2>&1; echo "sudo docker rc: $?"
