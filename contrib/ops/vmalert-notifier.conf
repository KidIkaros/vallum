# vmalert drop-in: route firing alerts to Alertmanager instead of the blackhole.
# Install: /etc/systemd/system/vmalert.service.d/notifier.conf
# The base unit deliberately ships -notifier.blackhole (the journal was the
# passive pager); this is the documented upgrade ("add -notifier.url on the day
# an Alertmanager exists"). Requires Alertmanager listening on 127.0.0.1:9093.
[Service]
ExecStart=
ExecStart=/usr/local/bin/vmalert-prod \
    -rule=/etc/vallum/vallum-alerts.yml \
    -datasource.url=http://127.0.0.1:8428 \
    -remoteWrite.url=http://127.0.0.1:8428 \
    -remoteRead.url=http://127.0.0.1:8428 \
    -httpListenAddr=127.0.0.1:8880 \
    -evaluationInterval=30s \
    -loggerLevel=INFO \
    -notifier.url=http://127.0.0.1:9093
