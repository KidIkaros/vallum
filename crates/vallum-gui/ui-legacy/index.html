<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vallum</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="identity">
        <span class="mark" aria-hidden="true"></span>
        <h1>Vallum</h1>
      </div>
      <div class="controls">
        <label for="interface" class="sr-only">Interface</label>
        <select id="interface"></select>
        <span id="state" class="state" role="status">connecting</span>
      </div>
    </header>

    <main>
      <p id="empty" class="empty" hidden>
        No daemon socket found. Start one with <code>vallum run</code>, or check
        the control socket directory.
      </p>

      <section class="panel" aria-labelledby="device-heading">
        <div class="panel-head">
          <h2 id="device-heading">Device</h2>
          <button id="edit-device" type="button" class="ghost">Runtime settings</button>
        </div>
        <dl class="fields">
          <div><dt>Interface</dt><dd id="f-interface">—</dd></div>
          <div><dt>Addresses</dt><dd id="f-addresses">—</dd></div>
          <div><dt>Listen port</dt><dd id="f-port">—</dd></div>
          <div><dt>Suite</dt><dd id="f-suite">—</dd></div>
          <div><dt>Firewall mark</dt><dd id="f-fwmark">—</dd></div>
          <div class="wide">
            <dt>Fingerprint</dt>
            <dd id="f-fingerprint" class="mono">—</dd>
          </div>
        </dl>
      </section>

      <section class="panel" aria-labelledby="counters-heading">
        <h2 id="counters-heading">Dataplane</h2>
        <div class="counters" id="counters"></div>
      </section>

      <section class="panel" aria-labelledby="peers-heading">
        <div class="panel-head">
          <h2 id="peers-heading">
            Peers <span id="peer-count" class="count">0</span>
          </h2>
          <div class="actions">
            <button id="invite-peer" type="button" class="ghost">Invite</button>
            <button id="add-peer" type="button" class="primary">Add peer</button>
          </div>
        </div>
        <table class="peers">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Endpoint</th>
              <th scope="col">Allowed IPs</th>
              <th scope="col" class="num">Handshake</th>
              <th scope="col" class="num">Tx</th>
              <th scope="col" class="num">Rx</th>
              <th scope="col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="peers"></tbody>
        </table>
        <p id="no-peers" class="empty" hidden>No peers configured.</p>
      </section>
    </main>

    <dialog id="dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
    </dialog>

    <script src="main.js"></script>
  </body>
</html>
