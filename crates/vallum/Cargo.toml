[package]
name = "vallum"
description = "Vallum's daemon: TOML configuration, key management, a TUN interface, and the UDP transport loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "qr"]
# The frame codec behind the animated bundle QR, without the terminal UI:
# consoles that render the code themselves (GUI canvas, HTTP clients) enable
# `qr` and get the same `VALLUM1` frames the TUI animates. No new dependency
# — `qrcode` was already in the lockfile for the TUI.
qr = ["dep:qrcode"]

[dependencies]
vallum-core.workspace = true
vallum-crypto.workspace = true
vallum-crypto-sdk.workspace = true
vallum-tunnel.workspace = true
vallum-config = { path = "../vallum-config" }
ipnet.workspace = true
# One syscall std does not expose: mlockall(MCL_CURRENT) pins the pages that
# hold key material so they cannot reach swap. MOOR's memory hygiene, adopted.
libc = "0.2"

# Configuration is the operator's surface, so the parser is a hard dependency
# rather than a hand-rolled one: a mis-parse here is a security bug.
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# The CLI. A binary may exit on a bad argument; `clap` does that and prints why.
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
serde_json = "1"
toml_edit = "0.25"
similar = "3"

# The terminal operations console. Optional so `--no-default-features` keeps a
# lean daemon; the release build enables it by default.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
qrcode = { version = "0.14", optional = true, default-features = false }

# The one place randomness is allowed to come from the operating system. The
# transport takes a `Randomness`, so the daemon is the only crate that binds that
# trait to a real source.
getrandom = "0.4"

# Signal handling, so a `SIGTERM` stops the loop rather than killing the process
# mid-write. The handler sets one flag and does nothing else.
signal-hook = "0.4"

# Privilege separation and Unix socket options. Safe wrappers over
# setgroups/setgid/setuid/prctl and friends, so every Vallum-owned crate keeps
# `unsafe_code = "forbid"`. Unix-wide — the Linux-only calls live behind cfg.
nix = { version = "0.31", features = ["user", "process", "socket", "net", "uio", "fs"] }

# Outer TLS 1.3 and QUIC DATAGRAM carriers (synchronous / sans-I/O so the
# daemon's seccomp allow-list and non-async architecture stay intact).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
bytes = "1"

# Linux only, for now. `tun2` is the TUN backend behind this crate's own trait;
# default features are off so no async runtime is pulled in.
[target.'cfg(target_os = "linux")'.dependencies]
tun2 = { version = "4.0", default-features = false }
# The syscall allow-list (ADR-0028). Safe Rust: it compiles a description to BPF
# and installs it, so `unsafe_code = "forbid"` survives — `libseccomp` is FFI and
# would trade the workspace invariant for convenience.
seccompiler = "0.5"
# IPv6 address assignment. `tun2`'s configuration path is an `AF_INET` ioctl, so
# a v6 address needs netlink; these crates provide it without `unsafe` in
# Vallum's own code.
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
# `IP_MTU_DISCOVER = DO` for IPv4, which neither nix nor socket2 exposes. Safe
# wrappers, so the `unsafe_code = "forbid"` invariant survives.
# `event` is for the marked TCP dial's bounded non-blocking connect: a fallback
# carrier that could hang its writer thread on a dead endpoint would take the
# whole tunnel with it.
rustix = { version = "1", features = ["net", "time", "event"] }

[dev-dependencies]
# Property tests for the UAPI codec: a parser on a socket boundary should be
# exercised with more than the examples we thought of.
proptest = "1.6"
# The gate drives the real stack: it builds the config from TOML, expands keys
# the way the CLI does, and runs two daemons against an in-process network. That
# means the test names the same lower crates the daemon does.
vallum-core.workspace = true
vallum-crypto.workspace = true
vallum-tunnel.workspace = true
vallum-crypto-sdk.workspace = true

[package.metadata.deb]
maintainer = "Vallum contributors"
maintainer-scripts = "../../packaging/debian"
copyright = "2026, Vallum contributors"
license-file = ["../../LICENSE", "4"]
extended-description = "Hybrid post-quantum layer-3 tunnel."
section = "net"
priority = "optional"
depends = "$auto"
# The asset list is one manifest across all three channels — install.sh
# installs this same set. scripts/check-package-manifest.sh fails CI when
# either table drifts from it.
assets = [
    ["target/release/vallum", "usr/bin/vallum", "755"],
    ["target/release/vallum-quick", "usr/bin/vallum-quick", "755"],
    ["../../packaging/vallum@.service", "lib/systemd/system/vallum@.service", "644"],
    # The executables the units above run. `vallum@.service` execs
    # vallum-heal-runtime-dir as its ExecStartPre, and ExecStartPre failure is
    # fatal - a package without it cannot start a tunnel at all.
    ["../../packaging/vallum-panic", "usr/local/sbin/vallum-panic", "755"],
    ["../../packaging/vallum-guard-deadman", "usr/local/sbin/vallum-guard-deadman", "755"],
    ["../../packaging/vallum-cleanup", "usr/local/sbin/vallum-cleanup", "755"],
    ["../../packaging/vallum-heal-runtime-dir", "usr/local/sbin/vallum-heal-runtime-dir", "755"],
    ["../../packaging/vallum-ops", "usr/local/sbin/vallum-ops", "755"],
    ["../../packaging/vallum-guard@.service", "lib/systemd/system/vallum-guard@.service", "644"],
    ["../../packaging/vallum-quick@.service", "lib/systemd/system/vallum-quick@.service", "644"],
    ["../../packaging/vallum-quick-watch@.service", "lib/systemd/system/vallum-quick-watch@.service", "644"],
    # The enrolment desk: the self-service layer an operator runs to sell
    # access. Ships, but nothing starts it until the operator enables it.
    ["../../packaging/vallum-desk@.service", "lib/systemd/system/vallum-desk@.service", "644"],
    ["../../service/vallum-desk", "usr/local/lib/vallum/vallum-desk", "755"],
    ["../../service/vallum-desk-admin", "usr/local/lib/vallum/vallum-desk-admin", "755"],
    ["../../service/vallum-uri", "usr/local/lib/vallum/vallum-uri", "755"],
    ["../../packaging/vallum-uri.desktop", "usr/share/applications/vallum-uri.desktop", "644"],
    ["../../packaging/vallum-enroll@.service", "lib/systemd/system/vallum-enroll@.service", "644"],
    ["../../packaging/vallum-metrics.service", "lib/systemd/system/vallum-metrics.service", "644"],
    ["../../packaging/vallum-metrics.timer", "lib/systemd/system/vallum-metrics.timer", "644"],
    ["../../packaging/vallum-cleanup.service", "lib/systemd/system/vallum-cleanup.service", "644"],
    ["../../packaging/vallum-deadman@.service", "lib/systemd/system/vallum-deadman@.service", "644"],
    ["../../packaging/vallum-deadman@.timer", "lib/systemd/system/vallum-deadman@.timer", "644"],
    ["../../packaging/vallum-tmpfiles.conf", "usr/lib/tmpfiles.d/vallum-tmpfiles.conf", "644"],
    ["../../packaging/vallum.8", "usr/share/man/man8/vallum.8", "644"],
    ["../../packaging/vallum-quick.8", "usr/share/man/man8/vallum-quick.8", "644"],
    ["../../packaging/vallum.toml.5", "usr/share/man/man5/vallum.toml.5", "644"],
    ["../../packaging/vallum.bash", "usr/share/bash-completion/completions/vallum", "644"],
    ["../../packaging/vallum.zsh", "usr/share/zsh/site-functions/_vallum", "644"],
    ["../../packaging/vallum.fish", "usr/share/fish/vendor_completions.d/vallum.fish", "644"],
]

[package.metadata.generate-rpm]
name = "vallum"
summary = "Hybrid post-quantum layer-3 tunnel"
license = "Apache-2.0"
assets = [
    { source = "../../target/release/vallum", dest = "/usr/bin/vallum", mode = "755" },
    { source = "../../target/release/vallum-quick", dest = "/usr/bin/vallum-quick", mode = "755" },
    { source = "../../packaging/vallum@.service", dest = "/lib/systemd/system/vallum@.service", mode = "644" },
    # The executables the units above run - see the deb table for why.
    { source = "../../packaging/vallum-panic", dest = "/usr/local/sbin/vallum-panic", mode = "755" },
    { source = "../../packaging/vallum-guard-deadman", dest = "/usr/local/sbin/vallum-guard-deadman", mode = "755" },
    { source = "../../packaging/vallum-cleanup", dest = "/usr/local/sbin/vallum-cleanup", mode = "755" },
    { source = "../../packaging/vallum-heal-runtime-dir", dest = "/usr/local/sbin/vallum-heal-runtime-dir", mode = "755" },
    { source = "../../packaging/vallum-ops", dest = "/usr/local/sbin/vallum-ops", mode = "755" },
    { source = "../../packaging/vallum-guard@.service", dest = "/lib/systemd/system/vallum-guard@.service", mode = "644" },
    { source = "../../packaging/vallum-quick@.service", dest = "/lib/systemd/system/vallum-quick@.service", mode = "644" },
    { source = "../../packaging/vallum-quick-watch@.service", dest = "/lib/systemd/system/vallum-quick-watch@.service", mode = "644" },
    { source = "../../packaging/vallum-desk@.service", dest = "/lib/systemd/system/vallum-desk@.service", mode = "644" },
    { source = "../../service/vallum-desk", dest = "/usr/local/lib/vallum/vallum-desk", mode = "755" },
    { source = "../../service/vallum-desk-admin", dest = "/usr/local/lib/vallum/vallum-desk-admin", mode = "755" },
    { source = "../../service/vallum-uri", dest = "/usr/local/lib/vallum/vallum-uri", mode = "755" },
    { source = "../../packaging/vallum-uri.desktop", dest = "/usr/share/applications/vallum-uri.desktop", mode = "644" },
    { source = "../../packaging/vallum-enroll@.service", dest = "/lib/systemd/system/vallum-enroll@.service", mode = "644" },
    { source = "../../packaging/vallum-metrics.service", dest = "/lib/systemd/system/vallum-metrics.service", mode = "644" },
    { source = "../../packaging/vallum-metrics.timer", dest = "/lib/systemd/system/vallum-metrics.timer", mode = "644" },
    { source = "../../packaging/vallum-cleanup.service", dest = "/lib/systemd/system/vallum-cleanup.service", mode = "644" },
    { source = "../../packaging/vallum-deadman@.service", dest = "/lib/systemd/system/vallum-deadman@.service", mode = "644" },
    { source = "../../packaging/vallum-deadman@.timer", dest = "/lib/systemd/system/vallum-deadman@.timer", mode = "644" },
    { source = "../../packaging/vallum-tmpfiles.conf", dest = "/usr/lib/tmpfiles.d/vallum-tmpfiles.conf", mode = "644" },
    { source = "../../packaging/vallum.8", dest = "/usr/share/man/man8/vallum.8", mode = "644" },
    { source = "../../packaging/vallum-quick.8", dest = "/usr/share/man/man8/vallum-quick.8", mode = "644" },
    { source = "../../packaging/vallum.toml.5", dest = "/usr/share/man/man5/vallum.toml.5", mode = "644" },
    { source = "../../packaging/vallum.bash", dest = "/usr/share/bash-completion/completions/vallum", mode = "644" },
    { source = "../../packaging/vallum.zsh", dest = "/usr/share/zsh/site-functions/_vallum", mode = "644" },
    { source = "../../packaging/vallum.fish", dest = "/usr/share/fish/vendor_completions.d/vallum.fish", mode = "644" },
]
# Same lifecycle contract as the deb maintainer scripts: stop units before
# the binaries leave, reload after, keep /etc/vallum (secrets are never the
# package manager's to delete silently — `vallum uninstall --purge` is).
[package.metadata.generate-rpm.scriptlets]
# post: mirror install.sh — reload so the new units resolve, and enable the
# metrics timer only where node_exporter's textfile collector exists (it is
# opt-in telemetry, never a default).
post = """
if [ -d /run/systemd/system ]; then
    # Create the runtime directory now, not at the next boot: the unit binds
    # ReadWritePaths to it, and a missing path is 226/NAMESPACE. See ADR-0017.
    systemd-tmpfiles --create /usr/lib/tmpfiles.d/vallum-tmpfiles.conf 2>/dev/null || true
    systemctl daemon-reload 2>/dev/null || true
    systemctl try-restart 'vallum@*' 'vallum-quick@*' 'vallum-quick-watch@*' 2>/dev/null || true
    if [ -d /var/lib/node_exporter/textfile_collector ]; then
        systemctl enable --now vallum-metrics.timer 2>/dev/null || true
    fi
    # The console's privileged path needs a sudoers rule, and a package cannot
    # write one: the rule names a user and the package does not know who is
    # installing it. The console falls back to polkit without it.
    if [ ! -f /etc/sudoers.d/vallum-ops ] && [ -x /usr/local/sbin/vallum-ops ]; then
        echo "vallum: to let the console run its privileged path without a password:" >&2
        echo "    echo 'YOUR_USER ALL=(root) NOPASSWD: /usr/local/sbin/vallum-ops' | sudo tee /etc/sudoers.d/vallum-ops >/dev/null" >&2
        echo "    sudo visudo -cf /etc/sudoers.d/vallum-ops" >&2
    fi
fi
exit 0
"""
preun = """
if [ "${1:-0}" -eq 0 ] && [ -d /run/systemd/system ]; then
    systemctl list-units --all --plain --no-legend 'vallum*@*' 2>/dev/null \
        | awk '{print $1}' | sed 's/\\.service$//;s/\\.timer$//' \
        | while read -r unit; do systemctl disable --now "$unit" 2>/dev/null || true; done
    systemctl disable --now vallum-metrics.timer vallum-metrics.service 2>/dev/null || true
fi
exit 0
"""
postun = """
if [ -d /run/systemd/system ]; then systemctl daemon-reload 2>/dev/null || true; fi
exit 0
"""
