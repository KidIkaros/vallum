[package]
name = "vallum"
description = "Vallum's daemon: TOML configuration, key management, a TUN interface, and the UDP transport loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
vallum-core.workspace = true
vallum-crypto.workspace = true
vallum-crypto-sdk.workspace = true
vallum-tunnel.workspace = true
ipnet.workspace = true

# Configuration is the operator's surface, so the parser is a hard dependency
# rather than a hand-rolled one: a mis-parse here is a security bug.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The CLI. A binary may exit on a bad argument; `clap` does that and prints why.
clap = { version = "4", features = ["derive"] }

# The one place randomness is allowed to come from the operating system. The
# transport takes a `Randomness`, so the daemon is the only crate that binds that
# trait to a real source.
getrandom = "0.4"

# Signal handling, so a `SIGTERM` stops the loop rather than killing the process
# mid-write. The handler sets one flag and does nothing else.
signal-hook = "0.3"

# Linux only, for now. `tun2` is the TUN backend behind this crate's own trait;
# default features are off so no async runtime is pulled in.
[target.'cfg(target_os = "linux")'.dependencies]
tun2 = { version = "4.0", default-features = false }
# Privilege separation. Safe wrappers over setgroups/setgid/setuid/prctl, so
# every Vallum-owned crate keeps `unsafe_code = "forbid"`.
nix = { version = "0.31", features = ["user", "process", "socket", "net", "uio"] }
# IPv6 address assignment. `tun2`'s configuration path is an `AF_INET` ioctl, so
# a v6 address needs netlink; these crates provide it without `unsafe` in
# Vallum's own code.
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
# `IP_MTU_DISCOVER = DO` for IPv4, which neither nix nor socket2 exposes. Safe
# wrappers, so the `unsafe_code = "forbid"` invariant survives.
rustix = { version = "1", features = ["net", "time"] }

[dev-dependencies]
# The gate drives the real stack: it builds the config from TOML, expands keys
# the way the CLI does, and runs two daemons against an in-process network. That
# means the test names the same lower crates the daemon does.
vallum-core.workspace = true
vallum-crypto.workspace = true
vallum-tunnel.workspace = true
vallum-crypto-sdk.workspace = true

[package.metadata.deb]
maintainer = "Vallum contributors"
copyright = "2026, Vallum contributors"
license-file = ["LICENSE", "4"]
extended-description = "Hybrid post-quantum layer-3 tunnel."
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/vallum", "usr/bin/vallum", "755"],
    ["../../packaging/vallum@.service", "lib/systemd/system/vallum@.service", "644"],
    ["../../packaging/vallum.8", "usr/share/man/man8/vallum.8", "644"],
    ["../../packaging/vallum-quick.8", "usr/share/man/man8/vallum-quick.8", "644"],
    ["../../packaging/vallum.toml.5", "usr/share/man/man5/vallum.toml.5", "644"],
    ["../../packaging/vallum.bash", "usr/share/bash-completion/completions/vallum", "644"],
]

[package.metadata.rpm]
package-name = "vallum"
summary = "Hybrid post-quantum layer-3 tunnel"
license = "Apache-2.0"
