[package]
name = "vallum-crypto-sdk"
description = "Vallum's origin-crypto-sdk adapter — the only crate that names SDK types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["ml-kem"]
# Enables the ML-KEM-768 leg and therefore suites 0x0002 and 0x0003.
ml-kem = ["origin-crypto-sdk/ml-kem"]

[dependencies]
vallum-crypto.workspace = true
origin-crypto-sdk.workspace = true

[dev-dependencies]
# The DudeCT harness. A dev-dependency on purpose: the daemon never links it,
# and the measurement lives beside the only crate allowed to name SDK types.
#
# The harnesses are `examples/`, not `benches/`: `cargo bench` passes `--bench`
# to a `harness = false` target, and dudect-bencher's CLI refuses it. Examples
# get dev-dependencies and no injected arguments, and `cargo run --release
# --example ct_ntru` is exactly what dudect-bencher documents.
dudect-bencher = "0.7"
