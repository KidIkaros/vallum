[package]
name = "vallum-tunnel"
description = "Vallum's transport: the peer table, cryptokey routing, and the per-peer handshake driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# `vallum-core` and `vallum-crypto` only, plus `ipnet` for prefix matching.
# No sockets, no TUN, no clock, no RNG: events come in, actions go out.
[dependencies]
vallum-core.workspace = true
vallum-crypto.workspace = true
ipnet.workspace = true

# Tests only: this crate carries no suite implementation, and a peer table cannot
# be built without one. Nothing here reaches the library.
[dev-dependencies]
vallum-crypto-sdk.workspace = true
