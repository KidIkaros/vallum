[package]
name = "vallum-core"
description = "Vallum handshake core: TLV framing and the 3-message hybrid-KEM AKE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# `vallum-crypto` ONLY. No provider, no SDK, no RNG crate: randomness enters as
# caller-supplied seeds. That is what makes the handshake byte-exact and what
# keeps the crypto boundary narrow enough to survive an implementation swap.
[lints]
workspace = true

[features]
# Exposes the transcript-signing primitives to the external test component.
# Never enabled by the daemon or by any library build; it exists so the protocol
# tests can live outside the inner circle without making the primitives public
# API in a normal build.
test-internals = []

[dependencies]
vallum-crypto.workspace = true
