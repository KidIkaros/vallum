# Alert rules for a Vallum server.
#
# Every rule carries exactly one threshold, and every threshold has a stated
# basis — the audit's finding was not that thresholds were missing, it was that
# any number would have done. These are derived from the daemon's own timers:
# rekey at 120 s, reject at 180 s, watchdog at 90 s.
#
# Load with:
#   prometheus --config.file=... --rule-file=vallum-alerts.yml
#
# The one thing NOT covered here is whether the *client* is leaking, because it
# is not a metric — it is a property of the client host. Poll it instead:
#   vallum status --config <path> --json   # exits 1 when verdict is LEAKING
groups:
  - name: vallum
    rules:
      # The daemon is answering the scrape but says the tunnel is down.
      # 180 s is the reject window: before that a handshake may still land, so
      # alerting earlier would page on a tunnel that is about to recover.
      - alert: VallumTunnelDown
        expr: vallum_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Vallum tunnel is down"
          description: >-
            No handshake for over 180 s, past the reject window. Clients are
            either blocked (if the guard is installed) or leaking.

      # A single peer whose last handshake is older than the reject point. This
      # is the peer-level version of the alert above and catches one dead client
      # on an otherwise healthy server.
      - alert: VallumHandshakeStale
        expr: vallum_peer_handshake_age_seconds > 180
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} has not handshaked in 180 s"
          description: >-
            Rekey is every 120 s, so 180 s means at least one rekey was missed
            and the session is past the reject point.

      # A sustained refusal rate means something is actively rejecting
      # handshakes — wrong key, wrong suite, or an epoch mismatch after a
      # restart. 0.1/s is 6 per minute, well above background retry noise.
      - alert: VallumHandshakeRefused
        expr: rate(vallum_loop_handshakes_refused_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vallum is refusing handshakes on {{ $labels.interface }}"
          description: >-
            Check the peer's suite and key. A restart without a config reload
            also shows up here as an epoch mismatch.

      # Dropped fragments mean the path MTU is smaller than what Vallum is
      # sending. The fault lab reproduces this with FAULT=mtu1280; 1/s sustained
      # is past what the reassembly window can absorb.
      - alert: VallumFragmentsDropped
        expr: rate(vallum_loop_fragments_dropped_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vallum is dropping fragments on {{ $labels.interface }}"
          description: >-
            A narrowing path. Path-MTU discovery should narrow the budget; if
            this fires continuously, discovery is not keeping up.

      # The stated capacity target from docs/requirements.md: 2,000 peers per
      # daemon on the default tri-hybrid suite, against a measured ceiling of
      # 2,211. Past the target the data plane starts competing with rekey.
      - alert: VallumAtCapacity
        expr: vallum_peers_total > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vallum is past its stated capacity"
          description: >-
            Above the 2,000-peer target. Move peers to another daemon, or switch
            to the 0x0002 suite if the threat model allows it.

      # Delivery ratio below threshold (0.1) across the rolling window indicates
      # the tunnel is sending packets that the far side is not receiving or answering.
      - alert: VallumPeerDeliveryLow
        expr: vallum_peer_delivery_ratio < 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} delivery ratio is degraded on {{ $labels.interface }}"
          description: >-
            Delivery ratio is below 10%, meaning traffic is being sent into the tunnel
            without return traffic. Check for firewall blocks, dead far-side sessions,
            or anti-spoofing allowed_ips drops.

      # Traffic entering the tunnel is being rejected because its inner source IP
      # is not in the peer's allowed_ips list (e.g. physical IP leaking into tunnel).
      - alert: VallumPeerAllowedIpsRejected
        expr: rate(vallum_peer_dropped_allowed_ips_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} has packets dropped by allowed_ips anti-spoofing"
          description: >-
            Datagrams are being rejected because inner source address does not match allowed_ips.
            Check vallum_last_rejected_source on the daemon to identify the leaking address.

      # Datagrams arriving with an unknown receiver index: typical after the receiving
      # side restarted or lost its session table while peers continue sending.
      - alert: VallumLoopDroppedUnknownIndex
        expr: rate(vallum_loop_dropped_unknown_index_total[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Vallum on {{ $labels.interface }} is dropping packets with unknown session index"
          description: >-
            Incoming packets reference sessions this daemon does not hold. Peers may need to re-initiate.

  # ── client-side rules ──────────────────────────────────────────────
  #
# A client needs its own group because the failures that matter to it are
# invisible from the server's counters: a fail-closed client whose tunnel is
# dead reports a perfectly healthy peer on the server. The signal is
# `vallum_client_verdict`,
  # the same verdict `vallum status` reports, scraped from the client host every
  # 15 s by the shipped `vallum-metrics.timer` with a `--config` argument (a
  # `--control`-only scrape cannot see guard state, so it emits none).
  #
  # DNS failing is not a separate alert on purpose: a client cannot resolve
  # outside the tunnel (the policy drops :53 egress and the resolver install is
  # fail-closed), so "DNS broke" manifests as one of the three states below —
  # degraded, blocked, or leaking. Paging on the verdict family pages on the
  # same signal the browsing suite asserts, not a parallel approximation.
  - name: vallum-client
    rules:
      # The guard is down and nothing is blocking: traffic — DNS included — is
      # leaving the host in the clear. This is the one condition that is always
      # actionable right now, so it pages with no grace period.
      - alert: VallumClientLeaking
        expr: vallum_client_verdict{verdict="LEAKING"}
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Client {{ $labels.interface }} is attached to nothing and blocking nothing"
          description: >-
            The daemon is gone and no guard holds. Everything on this host —
            browser, DNS, everything — is leaving outside the tunnel. Install
            the block first (`vallum policy on`), then restart the daemon.

      # The guard holds and traffic is being dropped: the intended failure
      # mode of a fail-closed client, which is *safer*, but it still means the
      # user has no network. 15 minutes of it is not a planned maintenance
      # window; a tunnel that recovers itself does so inside ADR-0019's budget.
      - alert: VallumClientBlocked
        expr: vallum_client_verdict{verdict="blocked"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.interface }} has egress blocked for 15 minutes"
          description: >-
            The daemon is gone and the guard holds, so traffic is blocked, not
            leaked — DNS included. Check why the daemon is not running
            (`systemctl status vallum` / `journalctl -u vallum`).

      # Attached, handshaked, and carrying nothing: the state a live
      # deployment sat in while delivering 1% of datagrams and reporting up.
      # The browser is dead even though every counter on the client looks
      # healthy. Same signal the recovery probes measure.
      - alert: VallumClientDegraded
        expr: vallum_client_verdict{verdict="degraded"}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.interface }} is attached but not carrying"
          description: >-
            The tunnel handshakes but its delivery ratio dropped below the
            floor (0.1 over a window with >= 100 sent). The client re-keyed and
            traffic did not come back: check the server side's peer delivery,
            and localhost MTU if it is a narrowed path.

      # A client handshakes on rekey, about one every 120 s — 0.008/s per
      # peer. One every 10 s sustained means recovery is looping: reconnect,
      # establish, lose it, repeat. Above steady state by 12x regardless of
      # how many peers a client carries, so the basis holds per host.
      - alert: VallumClientReconnectLoop
        expr: rate(vallum_loop_handshakes_established_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.interface }} is handshaking in a loop"
          description: >-
            Handshakes complete far faster than rekey cadence, which means the
            session keeps being lost and rebuilt — the "always-on with backoff"
            recovery is working, but something is repeatedly killing it. Look
            for MTU renegotiation, an unstable path, or a server cycling.
