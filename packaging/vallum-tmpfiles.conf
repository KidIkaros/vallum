#
# `/run/vallum` holds every control socket on the machine. It is a machine
# resource, not any one service's private state: created here so it exists
# before any unit starts and survives any unit stopping.
#
# This must not be a unit's `RuntimeDirectory`. systemd deletes those when the
# unit stops, which would remove the directory — and with it every *other*
# daemon's socket — every time the server restarted. That is what made
# `vallum peer add` report "the daemon is not running" while it was running, and
# what made `vallum@` fail to start with 226/NAMESPACE when the directory was
# absent. See ADR-0017.
#
# 0770, not 0750: the daemon publishes its control socket *after* dropping to
# `interface.user`, so the directory must be writable by that user's group.
# The installer chgrps it to `interface.group` (a `vallum` service user on a
# server, the login user on a personal client). 0777 would let any local user
# squat a socket path; 0770 keeps that to the group that already runs daemons.
#
# Sticky (1770): a group-writable dir lets any member unlink another member's
# socket and bind an impostor in its place — every console then hands its
# `set`/`setconf` bodies (private keys, peer PSKs) to the impostor. Sticky
# scopes unlink to the owner, closing socket-replacement while keeping
# group publication working (ADR-0048).
#
# Type  Path         Mode  User  Group  Age  Argument
d       /run/vallum  1770  root  root   -
