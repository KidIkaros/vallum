# Alert rules for a Vallum server.
#
# Every rule carries exactly one threshold, and every threshold has a stated
# basis — the audit's finding was not that thresholds were missing, it was that
# any number would have done. These are derived from the daemon's own timers:
# rekey at 120 s, reject at 180 s, watchdog at 90 s.
#
# Load with:
#   prometheus --config.file=... --rule-file=vallum-alerts.yml
#
# The one thing NOT covered here is whether the *client* is leaking, because it
# is not a metric — it is a property of the client host. Poll it instead:
#   vallum status --config <path> --json   # exits 1 when verdict is LEAKING
groups:
  - name: vallum
    rules:
      # The daemon is answering the scrape but says the tunnel is down.
      # 180 s is the reject window: before that a handshake may still land, so
      # alerting earlier would page on a tunnel that is about to recover.
      - alert: VallumTunnelDown
        expr: vallum_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Vallum tunnel is down"
          description: >-
            No handshake for over 180 s, past the reject window. Clients are
            either blocked (if the guard is installed) or leaking.

      # A single peer whose last handshake is older than the reject point. This
      # is the peer-level version of the alert above and catches one dead client
      # on an otherwise healthy server.
      - alert: VallumHandshakeStale
        expr: vallum_peer_handshake_age_seconds > 180
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} has not handshaked in 180 s"
          description: >-
            Rekey is every 120 s, so 180 s means at least one rekey was missed
            and the session is past the reject point.

      # A sustained refusal rate means something is actively rejecting
      # handshakes — wrong key, wrong suite, or an epoch mismatch after a
      # restart. 0.1/s is 6 per minute, well above background retry noise.
      - alert: VallumHandshakeRefused
        expr: rate(vallum_loop_handshakes_refused_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vallum is refusing handshakes on {{ $labels.interface }}"
          description: >-
            Check the peer's suite and key. A restart without a config reload
            also shows up here as an epoch mismatch.

      # Dropped fragments mean the path MTU is smaller than what Vallum is
      # sending. The fault lab reproduces this with FAULT=mtu1280; 1/s sustained
      # is past what the reassembly window can absorb.
      - alert: VallumFragmentsDropped
        expr: rate(vallum_loop_fragments_dropped_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vallum is dropping fragments on {{ $labels.interface }}"
          description: >-
            A narrowing path. Path-MTU discovery should narrow the budget; if
            this fires continuously, discovery is not keeping up.

      # The stated capacity target from docs/requirements.md: 2,000 peers per
      # daemon on the default tri-hybrid suite, against a measured ceiling of
      # 2,211. Past the target the data plane starts competing with rekey.
      - alert: VallumAtCapacity
        expr: vallum_peers_total > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vallum is past its stated capacity"
          description: >-
            Above the 2,000-peer target. Move peers to another daemon, or switch
            to the 0x0002 suite if the threat model allows it.

      # Delivery ratio below threshold (0.1) across the rolling window indicates
      # the tunnel is sending packets that the far side is not receiving or answering.
      - alert: VallumPeerDeliveryLow
        expr: vallum_peer_delivery_ratio < 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} delivery ratio is degraded on {{ $labels.interface }}"
          description: >-
            Delivery ratio is below 10%, meaning traffic is being sent into the tunnel
            without return traffic. Check for firewall blocks, dead far-side sessions,
            or anti-spoofing allowed_ips drops.

      # Traffic entering the tunnel is being rejected because its inner source IP
      # is not in the peer's allowed_ips list (e.g. physical IP leaking into tunnel).
      - alert: VallumPeerAllowedIpsRejected
        expr: rate(vallum_peer_dropped_allowed_ips_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} has packets dropped by allowed_ips anti-spoofing"
          description: >-
            Datagrams are being rejected because inner source address does not match allowed_ips.
            Check vallum_last_rejected_source on the daemon to identify the leaking address.

      # Datagrams arriving with an unknown receiver index: typical after the receiving
      # side restarted or lost its session table while peers continue sending.
      - alert: VallumLoopDroppedUnknownIndex
        expr: rate(vallum_loop_dropped_unknown_index_total[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Vallum on {{ $labels.interface }} is dropping packets with unknown session index"
          description: >-
            Incoming packets reference sessions this daemon does not hold. Peers may need to re-initiate.

  # ── client-side rules ──────────────────────────────────────────────
  #
# A client needs its own group because the failures that matter to it are
# invisible from the server's counters: a fail-closed client whose tunnel is
# dead reports a perfectly healthy peer on the server. The signal is
# `vallum_client_verdict`,
  # the same verdict `vallum status` reports, scraped from the client host every
  # 15 s by the shipped `vallum-metrics.timer` with a `--config` argument (a
  # `--control`-only scrape cannot see guard state, so it emits none).
  #
  # DNS failing is not a separate alert on purpose: a client cannot resolve
  # outside the tunnel (the policy drops :53 egress and the resolver install is
  # fail-closed), so "DNS broke" manifests as one of the four states below —
  # degraded, stale, blocked, or leaking. Paging on the verdict family pages on
  # the same signal the browsing suite asserts, not a parallel approximation.
  - name: vallum-client
    rules:
      # The guard is down and nothing is blocking: traffic — DNS included — is
      # leaving the host in the clear. This is the one condition that is always
      # actionable right now, so it pages with no grace period.
      - alert: VallumClientLeaking
        expr: vallum_client_verdict{verdict="LEAKING"}
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Client {{ $labels.interface }} is attached to nothing and blocking nothing"
          description: >-
            The daemon is gone and no guard holds. Everything on this host —
            browser, DNS, everything — is leaving outside the tunnel. Install
            the block first (`vallum policy on`), then restart the daemon.

      # The guard holds and traffic is being dropped: the intended failure
      # mode of a fail-closed client, which is *safer*, but it still means the
      # user has no network. 15 minutes of it is not a planned maintenance
      # window; a tunnel that recovers itself does so inside ADR-0019's budget.
      - alert: VallumClientBlocked
        expr: vallum_client_verdict{verdict="blocked"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.interface }} has egress blocked for 15 minutes"
          description: >-
            The daemon is gone and the guard holds, so traffic is blocked, not
            leaked — DNS included. Check why the daemon is not running
            (`systemctl status vallum` / `journalctl -u vallum`).

      # Attached, handshaked, and carrying nothing: the state a live
      # deployment sat in while delivering 1% of datagrams and reporting up.
      # The browser is dead even though every counter on the client looks
      # healthy. Same signal the recovery probes measure.
      - alert: VallumClientDegraded
        expr: vallum_client_verdict{verdict="degraded"}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.interface }} is attached but not carrying"
          description: >-
            The tunnel handshakes but its delivery ratio dropped below the
            floor (0.1 over a window with >= 100 sent). The client re-keyed and
            traffic did not come back: check the server side's peer delivery,
            and localhost MTU if it is a narrowed path.

      # Attached, and the protocol has given up on the key: no handshake inside
      # the 180 s reject window, so the session is dead while the daemon still
      # answers the socket. This is the state a laptop sat in for hours while
      # `status` reported `up`.
      #
      # 150 s is not a guess: it is the recovery budget the real-link gate
      # allows (`scripts/verify-remote.sh`, RECOVERY_BUDGET), measured at 4 s on
      # `wingman-vps`. Paging sooner would page on a recovery the suite says is
      # still on time; paging later would hide one that is not. With the reject
      # window in front of it, the pager fires ~5.5 minutes after the last
      # handshake, and says so in the annotation.
      - alert: VallumClientStale
        expr: vallum_client_verdict{verdict="stale"}
        for: 150s
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.interface }} has been stale past its 150 s recovery budget"
          description: >-
            For 150 s after the 180 s reject window the session has been dead
            while the daemon kept answering: nothing leaks — packets enter the
            tunnel and die there — but nothing works either, and recovery has
            already had the whole budget the real-link gate allows it. Check the
            path to the endpoint and whether the server is up.

      # Outside-in probes. The daemon's counters describe the tunnel; these
      # describe the deployment as the world reaches it. A failing probe with a
      # healthy `vallum_up` is the interesting case: the process is fine and the
      # path, the firewall or the certificate is not.
      - alert: VallumProbeFailing
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.probe }} probe failing against {{ $labels.instance }}"
          description: >-
            blackbox_exporter cannot complete the {{ $labels.probe }} probe. With
            `vallum_up 1` alongside, the daemon is healthy and something in front
            of it is not: a firewall, the TLS certificate, or the resolver.
            Run it by hand to see why:
            `curl -s "http://127.0.0.1:9115/probe?module=<probe>&target=<instance>"`.

      # 21 days: long enough that a genuine expiry is fixable, short enough that
      # it is a task rather than an incident. The certificate is what makes the
      # account page reachable, and a client's join flow starts there.
      - alert: VallumDeskCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 21 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The desk's TLS certificate expires in under 21 days"
          description: >-
            `probe_ssl_earliest_cert_expiry` is the earliest expiry in the chain
            served by {{ $labels.instance }}. Renew it before it lapses: an
            expired certificate makes the desk unreachable for every client that
            has not already joined, and the join flow is where an account is
            created.

      # The gate that proves the product, watched like a product. Two distinct
      # failures: the scheduled run failed, and the scheduled run stopped
      # happening. The second is the one that rots silently — a timer that was
      # disabled, a host that rebooted, a checkout that moved.
      - alert: VallumTwoHostGateFailing
        expr: vallum_verify_outcome{kind="assert_fail"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The two-host gate failed an assertion on {{ $labels.host }} at {{ $labels.commit }}"
          description: >-
            Vallum failed a claim it makes about itself. The cause is the gate's
            own output in `journalctl -u vallum-verify-scheduled`, and the run
            history is /var/lib/vallum/verify-history.jsonl beside it.

      # Deliberately NOT critical, and deliberately not the same alert. A run
      # the harness could not complete — an SSH timeout, a host that was down, a
      # moved checkout — says nothing about the tunnel. Paging on it would mean
      # paging for the test rig, which is exactly the conflation this split
      # exists to prevent.
      - alert: VallumTwoHostGateHarnessError
        expr: vallum_verify_outcome{kind="harness_error"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The two-host gate could not run on {{ $labels.host }}"
          description: >-
            The gate did not complete, so its result is unknown rather than bad.
            Usually the SSH transport to the target (the harness makes ~144
            operations per run) or the host being unavailable. Check
            `journalctl -u vallum-verify-scheduled` for the transport error; the
            tunnel's own health is a separate question, answered by vallum_up
            and the probes.

      - alert: VallumTwoHostGateStale
        expr: time() - vallum_verify_last_success_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The two-host gate has not passed on {{ $labels.host }} in 48 h"
          description: >-
            Either the nightly run has been failing for two days, or it has
            stopped running — a disabled timer, a host that stayed down, a moved
            checkout. `systemctl list-timers vallum-verify-scheduled.timer` says
            which, and `vallum_verify_last_success_timestamp_seconds == 0` means
            it has never passed here at all.

      # A pass that asserts less than the previous pass is the gate getting
      # weaker without getting red. This is the signal `verdict.sh` exists to
      # make visible, turned into an alert.
      - alert: VallumTwoHostGateWeakening
        expr: vallum_verify_assertions < 0.9 * (vallum_verify_assertions offset 7d)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The two-host gate is asserting less than it did a week ago on {{ $labels.host }}"
          description: >-
            Assertion count fell by more than 10% against the same series seven
            days ago. A gate that stops checking something still reports PASS,
            which is why the count is tracked. Look for a check that became
            conditional — the download assertion grew an "if curl is absent"
            branch, and that is the shape of this.

      # The control plane, not the tunnel. A daemon whose runtime directory
      # stopped being reachable keeps carrying traffic while nothing can talk to
      # it: `systemctl is-active` says active, `peer list` works (it reads the
      # config), and the only symptom is that `vallum` commands cannot reach the
      # socket. Observed 2026-11-09 and again 2026-11-17 on a live server, both
      # times after `systemd-tmpfiles --create` reset /run/vallum to root:root.
      # It does not clear without a restart, so this pages.
      - alert: VallumControlPlaneUnreachable
        expr: increase(vallum_control_rebind_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Vallum {{ $labels.interface }} cannot reach its own control socket"
          description: >-
            The daemon lost access to its runtime directory and cannot re-bind.
            The tunnel may still be carrying; nothing can administer it. Fix the
            directory's group and restart the unit:
            `sudo chgrp <interface.group> /run/vallum && sudo systemctl restart
            vallum@<stem>`.

      # A client handshakes on rekey, about one every 120 s — 0.008/s per
      # peer. One every 10 s sustained means recovery is looping: reconnect,
      # establish, lose it, repeat. Above steady state by 12x regardless of
      # how many peers a client carries, so the basis holds per host.
      - alert: VallumClientReconnectLoop
        expr: rate(vallum_loop_handshakes_established_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.interface }} is handshaking in a loop"
          description: >-
            Handshakes complete far faster than rekey cadence, which means the
            session keeps being lost and rebuilt — the "always-on with backoff"
            recovery is working, but something is repeatedly killing it. Look
            for MTU renegotiation, an unstable path, or a server cycling.

      # The alpha's one number: did any device that was handed a ticket ever
      # connect? 14 tickets with 0 handshakes read as a quiet healthy system for
      # a day, because nothing compared the two. This is that comparison, and it
      # is the alert the whole funnel exists to feed.
      #
      # `for: 24h` because an alpha legitimately sits idle overnight; a day of
      # nobody connecting, with tickets outstanding, is not idle.
      - alert: VallumNoDeviceEverConnected
        expr: vallum_alpha_handshaked_devices == 0 and vallum_alpha_devices_total > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          # Not `{{ $value }}`: the value here is the left-hand side of the `and`
          # (handshaked == 0), so it rendered "0 devices are tracked" while 14
          # were. A summary that names a number it did not measure is the exact
          # defect this slice exists to remove, and it reappeared in the first
          # alert written to catch it.
          summary: "No device has ever connected, and join tickets are outstanding"
          description: >-
            The desk has minted join tickets and no device has reached a
            handshake. Either nobody is trying (the alpha has no audience yet,
            which is worth knowing) or the join path is broken end to end and
            every visitor is failing at the same step. Read
            `vallum_alpha_devices{state="unredeemed"}`: if it equals the total,
            the tickets are being minted and never redeemed — check that the
            ticket's address and port are reachable from outside, which is the
            failure that made this alert necessary.

      # A desk that cannot reach the daemon reports every device as `unknown`,
      # which is honest and useless. This is the series that says the desk's own
      # view is degraded, so a reader knows to distrust the other alpha series.
      - alert: VallumDeskCannotSeeDaemon
        expr: vallum_alpha_daemon_answered == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The desk cannot read device liveness from the daemon"
          description: >-
            `vallum show --json` is failing from the desk's account, so every
            device renders `unknown`. The account page still works; its
            connection column does not. Check that the desk's `--config` path is
            readable by the unit's user and that `vallum@<stem>` is running.

      # The rule that would have caught a 30-hour failure. Every other alert here
      # reads Vallum's own metrics, and a unit that is not running emits none —
      # so a dead unit was invisible by construction. This reads the host's own
      # view of itself instead.
      - alert: VallumUnitFailed
        expr: vallum_failed_units_total > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} systemd unit(s) on {{ $labels.instance }} are failed"
          description: >-
            `systemctl --failed` is non-empty on the host that runs Vallum. Read
            `vallum_unit_failed` for which unit and `systemctl status <unit>` for
            why. A failed `vallum-quick@` or `vallum@` unit means the tunnel is
            not carrying; a failed unit that is not Vallum's is still worth
            knowing about on the box that terminates the VPN.

  # The monitoring watches itself. Every rule above depends on the telemetry
  # pusher running and on Alertmanager routing; if either dies, the rules go
  # silent and silence reads as green — the same absence that hid three failed
  # units for thirty hours. These two alert on the absence of the pipeline
  # itself: the dead-man's switch. The pusher also pages ntfy DIRECTLY when
  # Alertmanager is unreachable, so a broken router still reaches the operator.
  - name: vallum-monitoring
    rules:
      - alert: VallumMonitoringSilent
        expr: time() - vallum_monitoring_heartbeat_seconds > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The telemetry pusher on {{ $labels.instance }} has not reported in over three minutes"
          description: >-
            The monitoring pipeline itself is silent: the pusher timer may be
            dead, or VictoriaMetrics is not accepting pushes. Every other alert
            depends on this pipeline, so treat their silence as unknown, not
            green. Check `systemctl status vallum-telemetry.timer` and
            `journalctl -u vallum-telemetry.service -n 50`; confirm the store
            answers on 127.0.0.1:8428. See docs/deployment/monitoring.md.

      - alert: VallumPagerPathBroken
        expr: vallum_pager_path_ok == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager on {{ $labels.instance }} is unreachable — alerts are not being routed"
          description: >-
            vmalert can evaluate rules but cannot hand them to Alertmanager, so
            firing alerts reach nobody through the normal path. The telemetry
            pusher pages ntfy directly while this is broken (a separate timer,
            independent of the router). Check `systemctl status alertmanager`
            and `journalctl -u alertmanager -n 50`. This alert itself routes
            only once Alertmanager recovers; the direct page is the live notice.
