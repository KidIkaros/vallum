[package]
name = "vallum-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Its own workspace: the fuzz crate builds with the nightly sanitizer and must
# not join the main workspace (whose lints and stable toolchain are deliberate).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.vallum-core]
path = "../crates/vallum-core"

[dependencies.vallum-tunnel]
path = "../crates/vallum-tunnel"

[dependencies.vallum-crypto-sdk]
path = "../crates/vallum-crypto-sdk"

# The epoch target builds its key schedule directly, so it names the suite trait.
[dependencies.vallum-crypto]
path = "../crates/vallum-crypto"

# The enrolment framing lives with the CLI crate; the fuzzer needs its parser.
[dependencies.vallum]
path = "../crates/vallum"
default-features = false

[[bin]]
name = "message_parse"
path = "fuzz_targets/message_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_decode"
path = "fuzz_targets/handshake_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "fuzz_targets/replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enroll_parse"
path = "fuzz_targets/enroll_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "epoch_open"
path = "fuzz_targets/epoch_open.rs"
test = false
doc = false

# The reassembler: the one place an unauthenticated peer reaches the daemon's
# memory management. Two fragments whose claimed totals disagreed made the
# copy index past the end of the entry's buffer, and there is no catch_unwind
# on the daemon's loop thread.
[[bin]]
name = "segment_reassembly"
path = "fuzz_targets/segment_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shaping"
path = "fuzz_targets/shaping.rs"
test = false
doc = false
bench = false

[[bin]]
name = "carrier_framing"
path = "fuzz_targets/carrier_framing.rs"
test = false
doc = false
bench = false
