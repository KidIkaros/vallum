[workspace]
resolver = "2"
members = [
    "crates/vallum-core",
    "crates/vallum-crypto",
    "crates/vallum-crypto-sdk",
    "crates/vallum-crypto-contract",
    "crates/vallum-tunnel",
    "crates/vallum-protocol-tests",
    "crates/vallum-quick",
    "crates/vallum-config",
    "crates/vallum",
    "crates/vallum-gui",
]

[workspace.package]
version = "1.9.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Ikaros Digital", "Atomguard", "Vallum contributors"]
repository = "https://github.com/KidIkaros/vallum"

[workspace.dependencies]
vallum-crypto = { path = "crates/vallum-crypto" }
vallum-crypto-sdk = { path = "crates/vallum-crypto-sdk" }
vallum-core = { path = "crates/vallum-core" }
vallum-tunnel = { path = "crates/vallum-tunnel" }

# The only non-Vallum dependency of a library crate: prefix matching for
# cryptokey routing. Small, safe, and `no_std`-friendly; hand-rolling CIDR
# matching in the code that decides *where a packet goes* is how routing bugs
# become security bugs.
ipnet = "2.12"

# The SDK is pinned to an exact git tag (never a floating version), so a bare
# `git clone` of this repository builds without a sibling checkout. See the
# plan's disruption playbook: an SDK bump only recompiles the adapter.
#
# To iterate on the SDK locally, add a sibling checkout override (never commit
# it):
#
#   [patch."https://github.com/KidIkaros/OriginSDK"]
#   origin-crypto-sdk = { path = "../origin-crypto-sdk" }
origin-crypto-sdk = { git = "https://github.com/KidIkaros/OriginSDK", tag = "v0.7.4" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
# Denied, not forbidden: `privileges::lock_memory` is the single justified
# `unsafe` in the tree (mlockall has no safe wrapper) and allows it locally
# with its own SAFETY note. `forbid` cannot be overridden, so this is `deny`.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Release artifacts ship stripped; backtraces still resolve function names via
# the .gnu_debuglink-free symbol-free path because panic=unwind is kept.
strip = "symbols"
lto = "thin"
