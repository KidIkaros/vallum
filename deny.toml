# Supply-chain policy for Vallum.
#
# `advisories` duplicates the CI audit job on purpose: the job is the blocking
# check, and this file is what makes the same rules runnable locally
# (`cargo deny check`). Licenses and sources are the parts `cargo audit` does
# not cover at all.
#
# The SDK is a git dependency pinned by tag (see crates/vallum-crypto-sdk).
# Only that exact repository may appear as a git source; the tag and the
# resolved commit live in Cargo.lock. Its own `deny.toml` governs it.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `dudect-bencher` 0.7 is the constant-time harness, a dev-dependency. It
    # still depends on clap 2, which pulls `atty` and `ansi_term`. Both are
    # "unmaintained", not vulnerabilities, and neither is linked into the
    # daemon or any released artefact. Re-evaluate when dudect-bencher updates
    # its CLI.
    "RUSTSEC-2021-0139", # ansi_term
    "RUSTSEC-2024-0375", # atty
    # crypto-bigint 0.5.5 constant-time defect (RUSTSEC-2026-0387), riding the
    # SDK's direct `elliptic-curve = "0.13"` declaration. Measured 2026-10-25:
    # no SDK source file references elliptic-curve by its own path — every EC
    # call site (`ec_schnorr` on secp256k1, ES256 on secp256r1) imports it
    # through the k256/p256 0.14 re-exports, whose graph entry is the 0.7 line
    # (held at 0.7.9 here, past the yanked 0.7.6 fix) — so the 0.5.5 entry is
    # declared-at-Cargo.toml weight, not a path the shipped suites route
    # secrets through. The fix is upstream, not in this lock: OriginSDK drops
    # the declaration (its latest tag v0.7.3 is our pin), or ships a version on
    # the 0.14 line. Re-check when the SDK's pin moves.
    "RUSTSEC-2026-0387", # crypto-bigint — unused SDK direct-dep graph entry
]

[licenses]
version = 2
# Every dependency must fall in this list. Add a license only after reading why
# the crate needs it — this list is a decision, not a convenience.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    # `untrusted`, pulled by the SDK's `ring` dependency. Permissive.
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # `tun2`, the TUN backend. FSF Free/Libre and permissive; recorded in the
    # P6.4 artefact as a distribution consideration, and confined behind the
    # TUN trait so replacing it is one backend.
    "WTFPL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Every wildcard here is a path or workspace dependency: the SDK is pinned by
# path and the Vallum crates by path plus `Cargo.lock`, which is the pinning
# policy the disruption playbook requires. A crates.io wildcard would still be
# caught by review, and `cargo deny check bans` reports it as a warning below.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/KidIkaros/OriginSDK"]
