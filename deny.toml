# Supply-chain policy for Vallum.
#
# `advisories` duplicates the CI audit job on purpose: the job is the blocking
# check, and this file is what makes the same rules runnable locally
# (`cargo deny check`). Licenses and sources are the parts `cargo audit` does
# not cover at all.
#
# The SDK is a path dependency and is not in the crates.io graph; its own
# `deny.toml` governs it.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `dudect-bencher` 0.7 is the constant-time harness, a dev-dependency. It
    # still depends on clap 2, which pulls `atty` and `ansi_term`. Both are
    # "unmaintained", not vulnerabilities, and neither is linked into the
    # daemon or any released artefact. Re-evaluate when dudect-bencher updates
    # its CLI.
    "RUSTSEC-2021-0139", # ansi_term
    "RUSTSEC-2024-0375", # atty
]

[licenses]
version = 2
# Every dependency must fall in this list. Add a license only after reading why
# the crate needs it — this list is a decision, not a convenience.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    # `untrusted`, pulled by the SDK's `ring` dependency. Permissive.
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # `tun2`, the TUN backend. FSF Free/Libre and permissive; recorded in the
    # P6.4 artefact as a distribution consideration, and confined behind the
    # TUN trait so replacing it is one backend.
    "WTFPL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Every wildcard here is a path or workspace dependency: the SDK is pinned by
# path and the Vallum crates by path plus `Cargo.lock`, which is the pinning
# policy the disruption playbook requires. A crates.io wildcard would still be
# caught by review, and `cargo deny check bans` reports it as a warning below.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
